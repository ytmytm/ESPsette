[platformio]
default_envs = esp01_1m_serial

[env]
platform = platformio/espressif8266@4.2.1
framework = arduino
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dout
board_build.filesystem = littlefs
upload_speed = 460800
lib_deps =
  joaolopesf/RemoteDebug@3.0.5
  bblanchon/ArduinoJson@6.21.5
  tzapu/WiFiManager@2.0.17
; Telnet debug only — bundled WebSockets breaks on ESP8266 Arduino 3.x BearSSL.
; Soft tape GPIOs for USB-serial bench. Set GPIO=0 for real cassette pins.
build_flags =
  -DWEBSOCKET_DISABLED
  -DESPSETTE_GPIO_DISABLED=1
  ; OTA off while the PROGMEM demo keeps the 1MB image too large for a second copy.
  -DESPSETTE_OTA=0
extra_scripts = pre:scripts/filter_remotedebug.py

[env:esp01_512k_serial]
board = esp01
upload_protocol = esptool

[env:esp01_1m_serial]
board = esp01_1m
upload_protocol = esptool
; Required for 1MB + OTA: 64KB LittleFS (~958KB sketch). The board default
; 256KB FS caps the sketch at ~762KB and no longer fits. Do not enlarge FS
; for a TAP cache — stream tapes from the browser instead (see README).
board_build.ldscript = eagle.flash.1m64.ld

[env:esp01_1m_ota]
extends = env:esp01_1m_serial
upload_protocol = espota
; Optional auth via scripts/ota.sh when ESPSETTE_OTA_PASSWORD is set.

; Opt in only after GPIO2 has a protected, boot-safe 5 V to 3.3 V input.
[env:esp01_1m_write_serial]
extends = env:esp01_1m_serial
build_flags =
  ${env.build_flags}
  -DESPSETTE_WRITE_CAPTURE=1
  -DESPSETTE_GPIO_DISABLED=0

[env:esp01_4m_serial]
; ESP-01 with 4 MB flash uses the generic ESP8266 memory profile.
board = esp12e
upload_protocol = esptool

[env:esp01_4m_ota]
extends = env:esp01_4m_serial
upload_protocol = espota
; Optional auth via scripts/ota.sh when ESPSETTE_OTA_PASSWORD is set.

[env:esp01_4m_write_serial]
extends = env:esp01_4m_serial
build_flags =
  ${env.build_flags}
  -DESPSETTE_WRITE_CAPTURE=1
  -DESPSETTE_GPIO_DISABLED=0
