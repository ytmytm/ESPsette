[platformio]
default_envs = esp01_1m_serial

[env]
platform = platformio/espressif8266@4.2.1
framework = arduino
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dout
board_build.filesystem = littlefs
;; 460800 worked on CH340; 921600 is usually fine. If upload fails, drop to 460800.
upload_speed = 921600
upload_speed = 460800
lib_deps = joaolopesf/RemoteDebug@3.0.5
; Telnet debug only — bundled WebSockets breaks on ESP8266 Arduino 3.x BearSSL.
build_flags = -DWEBSOCKET_DISABLED
extra_scripts = pre:scripts/filter_remotedebug.py

[env:esp01_512k_serial]
board = esp01
upload_protocol = esptool

[env:esp01_1m_serial]
board = esp01_1m
upload_protocol = esptool

[env:esp01_1m_ota]
extends = env:esp01_1m_serial
upload_protocol = espota
upload_flags = --auth=${sysenv.ESPSETTE_OTA_PASSWORD}

[env:esp01_4m_serial]
; ESP-01 with 4 MB flash uses the generic ESP8266 memory profile.
board = esp12e
upload_protocol = esptool

[env:esp01_4m_ota]
extends = env:esp01_4m_serial
upload_protocol = espota
upload_flags = --auth=${sysenv.ESPSETTE_OTA_PASSWORD}
