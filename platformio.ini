[platformio]
default_envs = esp01_1m_serial

[env]
platform = platformio/espressif8266@4.2.1
framework = arduino
board_build.f_cpu = 80000000L
board_build.f_flash = 40000000L
board_build.flash_mode = dout
board_build.filesystem = littlefs
upload_speed = 460800
lib_deps =
  joaolopesf/RemoteDebug@3.0.5
  bblanchon/ArduinoJson@6.21.5
  tzapu/WiFiManager@2.0.17
; Telnet debug only — bundled WebSockets breaks on ESP8266 Arduino 3.x BearSSL.
; Real cassette pins (MOTOR/SENSE/READ). Set =1 for USB-serial soft-GPIO bench.
build_flags =
  -DWEBSOCKET_DISABLED
  -DESPSETTE_GPIO_DISABLED=0
  ; OTA deliberately disabled while investigating standard READ playback.
  -DESPSETTE_OTA=0
extra_scripts =
  pre:scripts/filter_remotedebug.py
  pre:scripts/pio-native.py

[env:esp01_512k_serial]
board = esp01
upload_protocol = esptool

[env:esp01_1m_serial]
board = esp01_1m
upload_protocol = esptool
; Required for 1MB + OTA: 64KB LittleFS (~958KB sketch). The board default
; 256KB FS caps the sketch at ~762KB and no longer fits. Do not enlarge FS
; for a TAP cache — stream tapes from the browser instead (see README).
board_build.ldscript = eagle.flash.1m64.ld

[env:esp01_1m_ota]
extends = env:esp01_1m_serial
upload_protocol = espota
; Optional auth via scripts/ota.sh when ESPSETTE_OTA_PASSWORD is set.

[env:esp01_4m_serial]
; ESP-01 with 4 MB flash uses the generic ESP8266 memory profile.
board = esp12e
upload_protocol = esptool

[env:esp01_4m_ota]
extends = env:esp01_4m_serial
upload_protocol = espota
; Optional auth via scripts/ota.sh when ESPSETTE_OTA_PASSWORD is set.
