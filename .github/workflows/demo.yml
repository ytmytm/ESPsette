name: Browser demo

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/demo.yml'
      - 'scripts/build-demo.py'
      - 'tests/test_demo_site.py'
      - 'tests/player_index.mjs'
      - 'tests/playback_awake.mjs'
      - 'tests/fixtures/**'
      - 'web/**'
      - 'assets/demo/**'
  pull_request:
    paths:
      - '.github/workflows/demo.yml'
      - 'scripts/build-demo.py'
      - 'tests/test_demo_site.py'
      - 'tests/player_index.mjs'
      - 'tests/playback_awake.mjs'
      - 'tests/fixtures/**'
      - 'web/**'
      - 'assets/demo/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Test player and demo packaging
        run: |
          node tests/player_index.mjs
          node tests/playback_awake.mjs
          python3 -m unittest discover -s tests -p 'test_demo_site.py' -v
      - name: Build the static demo
        run: python3 scripts/build-demo.py
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/demo

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy demo
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
