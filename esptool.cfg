# CH340 (wemos.cc) without RTS — verified wiring while flashing:
#   GPIO0–GND, adapter TXD–ESP RXD, adapter RXD–ESP TXD, VCC–VCC (3.3 V),
#   adapter DTR–ESP RST (plus CH_PD held at 3.3 V).
# DTR-only reset polarity below matches that adapter; alternate is D1|W0.1|D0|W0.05|D1.
[esptool]
custom_reset_sequence = D0|W0.1|D1|W0.05|D0
custom_hard_reset_sequence = D0|W0.05|D1|W0.05|D0
